# Production compose — built images only, no source mounts, internal network
# for DB/Redis, nginx is the only host-exposed service. All secrets via env_file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - '127.0.0.1:1883:1883'   # bind to loopback only — not accessible from outside the host
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/acl:/mosquitto/config/acl:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mqtt-data:/mosquitto/data
    networks: [internal]
    env_file: .env.production
    environment:
      # env_file loads MQTT_USERNAME and MQTT_PASSWORD into the container so
      # the healthcheck ($$MQTT_USERNAME / $$MQTT_PASSWORD) can read them
      # without needing those vars exported to the host shell.
      MQTT_USERNAME: ${MQTT_USERNAME:-fpanalyzer-mqtt-u1}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    healthcheck:
      test: ['CMD-SHELL', 'mosquitto_pub -h localhost -p 1883 -t "health/broker" -m "ok" -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - '4000:4000'
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '3000:3000'
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mqtt-data:
