# Production compose — built images only, no source mounts, internal network
# for DB/Redis, nginx is the only host-exposed service. All secrets via env_file.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  mqtt:
    # mosquitto-go-auth bundles Mosquitto 2 with the Postgres auth plugin, so
    # device credentials live in public.mqtt_devices instead of a flat file.
    image: iegomez/mosquitto-go-auth:latest
    restart: unless-stopped
    ports:
      # Reachable by the Raspberry Pi fleet. TLS only — there is no plain 1883.
      - '8883:8883'
    volumes:
      - ./docker/mosquitto/mosquitto.conf.template:/mosquitto/config/mosquitto.conf.template:ro
      - ./docker/mosquitto/entrypoint.sh:/mosquitto/entrypoint.sh:ro
      - ./docker/mosquitto/certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
    networks: [internal]
    env_file: .env.production
    entrypoint: ['/bin/sh', '/mosquitto/entrypoint.sh']
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Authenticates as the backend service account over TLS — proves the
      # listener, the certificate chain, and the Postgres auth path all work.
      test:
        - CMD-SHELL
        - >-
          mosquitto_pub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt
          -t 'health/broker' -m 'ok'
          -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD" || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - '4000:4000'
    volumes:
      # The backend verifies the broker's certificate against this CA, so it
      # needs the same ca.crt the broker was issued from. Read-only: the
      # private keys in this directory must never be writable from the app.
      - ./docker/mosquitto/certs:/app/certs:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      HOSTNAME: '0.0.0.0'
    ports:
      - '3000:3000'
    networks: [internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "node -e \"const h=require('http');const r=h.get('http://localhost:3000/',res=>{process.exit(res.statusCode<500?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(8000,()=>{r.destroy();process.exit(1)})\""]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 60s

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mqtt-data:
