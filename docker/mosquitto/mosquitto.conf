# Mosquitto broker — development configuration
# Port 1883: plain MQTT (localhost only for dev)
# Port 8883: TLS MQTT (for production, commented out below)

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd

# Disable port 1883 externally in production; enable TLS on 8883 instead.
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# cafile   /mosquitto/certs/ca.crt
# require_certificate false

# ACL file (one rule per provisioned device + superuser express-backend)
acl_file /mosquitto/config/acl

# Persistence — broker stores in-flight QoS1 messages across restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type information
log_type subscribe

# Security hardening
max_packet_size 65536
max_queued_messages 1000
